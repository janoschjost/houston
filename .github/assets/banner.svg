<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#141b29"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#9cc3e8"/>
      <stop offset="0.55" stop-color="#4f7fae"/>
      <stop offset="1" stop-color="#1c2a40"/>
    </radialGradient>
    <radialGradient id="moon" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#f0c7b2"/>
      <stop offset="1" stop-color="#9a5f45"/>
    </radialGradient>
    <radialGradient id="glow" r="50%">
      <stop offset="0" stop-color="#6fa8dc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6fa8dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" x2="1">
      <stop offset="0" stop-color="#d9b36c" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#d9b36c"/>
      <stop offset="1" stop-color="#f5e2b8"/>
    </linearGradient>
    <path id="orbit" d="M 690 160 m -170 0 a 170 62 -12 1 0 340 0 a 170 62 -12 1 0 -340 0"/>
    <clipPath id="frame"><rect width="900" height="320" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="320" fill="url(#sky)"/>

    <!-- starfield -->
    <g fill="#d5d8de">
      <circle cx="40" cy="30" r="1"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="80" r="1.4"><animate attributeName="opacity" values=".3;1;.3" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="24" r=".8"><animate attributeName="opacity" values="1;.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="290" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="40" r="1"><animate attributeName="opacity" values="1;.25;1" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="300" r=".9"><animate attributeName="opacity" values=".4;1;.4" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="20" r="1.3"><animate attributeName="opacity" values="1;.2;1" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="295" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="30" r="1.1"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="70" r=".8"><animate attributeName="opacity" values=".2;1;.2" dur="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="270" r="1.3"><animate attributeName="opacity" values="1;.25;1" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="250" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="300" r=".7"/><circle cx="250" cy="150" r=".6"/><circle cx="430" cy="110" r=".7"/>
      <circle cx="560" cy="250" r=".6"/><circle cx="820" cy="180" r=".7"/><circle cx="20" cy="140" r=".6"/>
    </g>

    <!-- shooting star -->
    <line x1="0" y1="0" x2="60" y2="18" stroke="#d5d8de" stroke-width="1.2" stroke-linecap="round" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="80 40; 420 140" dur="7s" keyTimes="0;1" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;.9;0;0" keyTimes="0;.7;.75;.85;1" dur="7s" repeatCount="indefinite"/>
    </line>

    <!-- planet system -->
    <circle cx="690" cy="160" r="120" fill="url(#glow)"/>
    <use href="#orbit" fill="none" stroke="#2c3547" stroke-width="1" stroke-dasharray="2 6"/>
    <ellipse cx="690" cy="160" rx="196" ry="80" transform="rotate(-12 690 160)" fill="none" stroke="#1e2533" stroke-width="1" stroke-dasharray="1 8"/>
    <circle cx="690" cy="160" r="56" fill="url(#planet)"/>
    <path d="M 650 140 q 40 -12 82 4 M 640 166 q 50 -10 100 4" stroke="#9cc3e8" stroke-opacity=".25" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="690" cy="160" rx="88" ry="16" transform="rotate(-12 690 160)" fill="none" stroke="#a39bc4" stroke-width="3" stroke-opacity=".7"/>

    <!-- small moon on the outer ellipse -->
    <circle cx="0" cy="0" r="11" fill="url(#moon)">
      <animateMotion dur="22s" repeatCount="indefinite" rotate="0"
        path="M 690 160 m -196 0 a 196 80 0 1 0 392 0 a 196 80 0 1 0 -392 0"/>
    </circle>

    <!-- rocket on the inner orbit -->
    <g>
      <animateMotion dur="11s" repeatCount="indefinite" rotate="auto">
        <mpath href="#orbit"/>
      </animateMotion>
      <g transform="translate(-14 0)">
        <path d="M -20 0 L 0 -4 L 0 4 Z" fill="url(#flame)">
          <animate attributeName="d" values="M -20 0 L 0 -4 L 0 4 Z;M -28 0 L 0 -4 L 0 4 Z;M -20 0 L 0 -4 L 0 4 Z" dur=".25s" repeatCount="indefinite"/>
        </path>
        <path d="M 0 -6 L 18 -6 Q 30 0 18 6 L 0 6 Z" fill="#d5d8de"/>
        <circle cx="15" cy="0" r="2.6" fill="#6fa8dc"/>
        <path d="M 2 -6 L -4 -12 L 8 -6 Z M 2 6 L -4 12 L 8 6 Z" fill="#d4977a"/>
      </g>
    </g>

    <!-- title -->
    <text x="56" y="132" fill="#f0f2f5" font-size="58" font-weight="700" letter-spacing="10">HOUSTON</text>
    <text x="58" y="168" fill="#6f7a8e" font-size="15" letter-spacing="2">mission control for your Claude Code agents</text>

    <g font-size="12" fill="#6f7a8e">
      <text x="58" y="222"><tspan fill="#8fbf8f">●</tspan> 2 working</text>
      <text x="170" y="222"><tspan fill="#d9b36c">●<animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></tspan> 1 waiting</text>
      <text x="282" y="222"><tspan fill="#6f7a8e">●</tspan> 3 standby</text>
      <text x="58" y="252">T+<tspan fill="#d5d8de">00:42:17</tspan>  ·  5h window <tspan fill="#8fbf8f">72% left</tspan></text>
      <text x="58" y="282" fill="#2c3547">────────────────────────────────────</text>
    </g>
    <rect x="58" y="270" width="8" height="14" fill="#6fa8dc">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
