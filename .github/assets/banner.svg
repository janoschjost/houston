<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <!-- Houston identity: Blueprint × Orbit (DWG HSTN-ID rev D). All motion runs on the 2.4 s period. -->
  <defs>
    <radialGradient id="film" cx="72%" cy="45%" r="80%"><stop offset="0" stop-color="#13213a"/><stop offset="1" stop-color="#0b1220"/></radialGradient>
    <pattern id="minor" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#8cc8f0" stroke-opacity=".05"/></pattern>
    <pattern id="major" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#8cc8f0" stroke-opacity=".09"/></pattern>
    <clipPath id="frame"><rect width="900" height="320" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="320" fill="url(#film)"/>
    <rect width="900" height="320" fill="url(#minor)"/>
    <rect width="900" height="320" fill="url(#major)"/>
    <rect x="10.5" y="10.5" width="879" height="299" fill="none" stroke="#8cc8f0" stroke-opacity=".1"/>

    <!-- the mark, ring r40 drawn at 2.75× -->
    <g transform="translate(690 160)">
      <path d="M0 0 L0 -110 A110 110 0 0 1 95.3 -55 Z" fill="#8cc8f0" fill-opacity=".08">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="19.2s" repeatCount="indefinite"/>
      </path>
      <g fill="none" stroke="#8cc8f0" stroke-width="1.8" stroke-linecap="round">
        <circle r="110"/>
        <path d="M0 -127v27M0 100v27M-127 0h27M100 0h27" stroke-opacity=".55"/>
        <circle r="44" fill="#101c33"/>
        <g transform="rotate(-14)" stroke-opacity=".38">
          <ellipse rx="44" ry="12.4"/>
          <ellipse rx="17.9" ry="44"/>
        </g>
        <circle r="150" stroke-opacity=".14" stroke-dasharray="2 8"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="9.6s" repeatCount="indefinite"/>
        <circle cy="-110" r="13.75" fill="#eba582" stroke="#0f1c33" stroke-width="7" paint-order="stroke"/>
      </g>
    </g>
    <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.2" fill="#8394ad" fill-opacity=".7">
      <text x="690" y="20" text-anchor="middle">000</text>
      <text x="830" y="164">090</text>
      <text x="690" y="306" text-anchor="middle">180</text>
      <text x="540" y="164" text-anchor="end">270</text>
      <text x="876" y="300" text-anchor="end">DWG HSTN-ID · REV D</text>
    </g>

    <!-- title -->
    <text x="56" y="128" fill="#e1e9f5" font-family="'IBM Plex Sans Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif" font-size="56" font-weight="600" letter-spacing="17">HOUSTON</text>
    <text x="58" y="164" fill="#8394ad" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3.6">MISSION CONTROL FOR CLAUDE CODE</text>
    <path d="M58 186H440" stroke="#2a3c58"/>

    <!-- status lights: working orbits, waiting parks and beats, standby rests at 45° -->
    <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8394ad">
      <g transform="translate(66 216)">
        <circle r="7" fill="none" stroke="#8fd8b4" stroke-opacity=".45" stroke-width="1.5"/>
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/><circle cy="-7" r="2.8" fill="#8fd8b4" stroke="#0e1828" stroke-width="2"/></g>
      </g>
      <text x="82" y="220">2 working</text>
      <g transform="translate(178 216)">
        <circle r="7" fill="none" stroke="#f3c86f" stroke-opacity=".5" stroke-width="1.5"/>
        <circle cy="-7" r="2.8" fill="#f3c86f" stroke="#0e1828" stroke-width="2"><animate attributeName="r" values="2.8;4;2.8" dur="1.2s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/></circle>
      </g>
      <text x="194" y="220">1 waiting</text>
      <g transform="translate(290 216)">
        <circle r="7" fill="none" stroke="#8394ad" stroke-opacity=".6" stroke-width="1.5"/>
        <circle cx="4.95" cy="-4.95" r="2.8" fill="#8394ad" stroke="#0e1828" stroke-width="2"/>
      </g>
      <text x="306" y="220">3 standby</text>
      <text x="58" y="256" letter-spacing="1.2">T+<tspan fill="#e1e9f5">00:42:17</tspan>  ·  5H WINDOW <tspan fill="#8fd8b4">72% LEFT</tspan></text>
    </g>
  </g>
</svg>
