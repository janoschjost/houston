    <text x="16" y="259" fill="#8394ad" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5">1 working   1 waiting   1 standby</text>

    <!-- pane -->
    <g font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12">
      <text x="270" y="64" fill="#8394ad">⏺ Read src/auth/session.ts</text>
      <text x="270" y="86" fill="#8394ad">⏺ The redirect fires before the cookie is set, so the guard</text>
      <text x="270" y="102" fill="#8394ad">  sees an anonymous user and bounces back to /login.</text>
      <text x="270" y="126" fill="#8394ad">⏺ Update <tspan fill="#e1e9f5">src/auth/middleware.ts</tspan></text>
      <text x="290" y="146" fill="#f08a83">-  if (!user) return redirect("/login")</text>
      <text x="290" y="164" fill="#8fd8b4">+  if (!user &amp;&amp; !isAuthRoute(req)) return redirect("/login")</text>
      <text x="270" y="196" fill="#eba582">✻ Orbiting… <tspan fill="#8394ad">(esc to interrupt)</tspan></text>
    </g>

    <rect x="251" y="242" width="649" height="26" fill="#0f1828"/>
    <line x1="251" y1="242.5" x2="900" y2="242.5" stroke="#1c2a40"/>
    <g font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5">
      <text x="266" y="259" fill="#8fd8b4">Working</text>
      <text x="330" y="259" fill="#8394ad">~/code/shop   SID 3f9a1c2e</text>
