    <line x1="0" y1="78.5" x2="250" y2="78.5" stroke="#1c2a40"/>

    <rect x="12" y="90" width="8" height="8" rx="2" fill="#c3a6e8" fill-opacity=".35" stroke="#c3a6e8" stroke-width="1.4"/>
    <text x="28" y="98" fill="#e1e9f5" font-weight="600">shop</text>
    <text x="236" y="98" fill="#f3c86f" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" text-anchor="end">+2 ~5 ?1</text>

    <rect x="22" y="108" width="220" height="40" rx="4" fill="#8cc8f0" fill-opacity=".07" stroke="#2a3c58"/>
    <g transform="translate(38 121)">
