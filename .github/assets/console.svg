    <text x="270" y="22" fill="#8394ad"><tspan fill="#c3a6e8" font-weight="600">shop</tspan> / <tspan fill="#e1e9f5" font-weight="500">Fix login redirect loop</tspan> <tspan font-family="'IBM Plex Mono', Menlo, monospace" font-size="11">~/code/shop</tspan></text>
    <line x1="0" y1="36.5" x2="900" y2="36.5" stroke="#1c2a40"/>

