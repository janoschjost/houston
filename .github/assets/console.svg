      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/><circle cy="-5.5" r="2.2" fill="#8fd8b4" stroke="#121e31" stroke-width="1.6"/></g>
