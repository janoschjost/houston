      <circle cy="-5.5" r="2.2" fill="#f3c86f" stroke="#0f1828" stroke-width="1.6"><animate attributeName="r" values="2.2;3.2;2.2" dur="1.2s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/></circle>
