<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Houston</title>
    <!-- Inline so the boot screen is styled before the bundled stylesheet loads; colours mirror style.css. -->
    <style>
      html, body { margin: 0; background: #0d0f12; }
      #boot {
        position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
        background:
          linear-gradient(#8cc8f017 1px, transparent 1px) 0 0 / 24px 24px,
          linear-gradient(90deg, #8cc8f017 1px, transparent 1px) 0 0 / 24px 24px,
          radial-gradient(ellipse at 50% 42%, #141b26, #0d0f12 70%);
        color: #8b94a1; font: 500 10.5px/1.4 "IBM Plex Mono", Menlo, monospace;
        transition: opacity .4s cubic-bezier(.3, .7, .2, 1);
      }
      #boot.done { opacity: 0; pointer-events: none; }
      .boot-card { display: grid; justify-items: center; gap: 18px; text-align: center; }
      .boot-mark { width: 148px; height: 148px; overflow: visible; fill: none; stroke: #8cc8f0; stroke-linecap: round; }
      .boot-mark * { vector-effect: non-scaling-stroke; stroke-width: 1.6px; }
      .boot-mark .draw { stroke-dasharray: 1; animation: boot-draw 1.2s cubic-bezier(.45, 0, .55, 1) both; }
      .boot-mark .faint { stroke-opacity: .38; animation: boot-fade .6s ease 1s both; }
      .boot-mark .tick { stroke-opacity: .55; }
      .boot-mark .body { fill: #121519; }
      .boot-sat { transform-origin: 50px 50px; animation: boot-spin 2.4s cubic-bezier(.45, 0, .55, 1) both, boot-spin 9.6s linear 2.4s infinite; }
      .boot-sat circle { fill: #eba582; stroke: #121519; stroke-width: 4px; }
      .boot-title { color: #e3e7ed; font: 600 30px/1 "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; letter-spacing: .32em; margin-right: -.32em; animation: boot-track 1.2s cubic-bezier(.45, 0, .55, 1) .3s both; }
      .boot-sub { margin-top: 10px; letter-spacing: .3em; margin-right: -.3em; text-transform: uppercase; font-size: 10px; }
      .boot-status { display: inline-flex; align-items: center; gap: 10px; letter-spacing: .2em; text-transform: uppercase; }
      .boot-status.failed { color: #f08a83; text-transform: none; letter-spacing: 0; max-width: 60ch; }
      .boot-status svg { width: 14px; height: 14px; fill: none; stroke: #a9b8ff; stroke-width: 1.3; stroke-dasharray: 1; animation: boot-loop 2.4s cubic-bezier(.45, 0, .55, 1) infinite; }
      .boot-status.failed svg { display: none; }
      @keyframes boot-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes boot-loop { from { stroke-dashoffset: 1; } 60%, to { stroke-dashoffset: 0; } }
      @keyframes boot-fade { from { opacity: 0; } }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-track { from { letter-spacing: .8em; opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #boot * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="brand" data-tauri-drag-region>
          <button id="home-link" class="brand-link" title="Home (⇧⌘H)" aria-label="Home">
            <span id="brand-mark"></span>
            <span class="brand-type">
              <span class="brand-name">HOUSTON</span>
              <span class="brand-sub">mission control</span>
            </span>
          </button>
        </div>
        <div id="projects"></div>
        <div class="sidebar-foot">
          <button id="add-project" data-icon="project">Add project <kbd>⌘O</kbd></button>
          <button id="open-aliases" data-icon="alias">Aliases <kbd>⌘⇧P</kbd></button>
          <div id="telemetry"></div>
          <div id="limits"></div>
        </div>
        <div id="sidebar-gutter" class="gutter col" title="Drag to resize · double-click to reset"></div>
      </aside>
      <main>
        <header id="topbar" data-tauri-drag-region>
          <div class="topbar-left" data-tauri-drag-region>
            <button id="toggle-sidebar" class="icon-btn" data-icon="sidebar" title="Toggle sidebar (⌘B)" aria-label="Toggle sidebar"></button>
            <div id="crumbs" data-tauri-drag-region></div>
          </div>
          <div class="actions">
            <button id="waiting-pill" class="hidden" title="Review waiting sessions (⌘I) · next waiting (⌘J)"></button>
            <button id="new-claude" class="btn-claude" data-icon="agent">Claude <kbd>⌘N</kbd></button>
            <button id="new-shell" data-icon="shell">Shell <kbd>⌘T</kbd></button>
            <div class="seg">
              <button data-layout="focus" data-icon="focus">Focus</button>
              <button data-layout="grid" data-icon="grid">Grid</button>
              <button data-layout="split" data-icon="split" title="Split view (⌘\)">Split</button>
            </div>
          </div>
        </header>
        <div class="stage-wrap">
          <!-- Blueprint backdrop behind the panes: grid, drawings and a few slow animations. -->

            <div class="stars"><i class="shooting"></i></div>

              <circle cx="250" cy="320" r="2" class="fill bp-blip" style="animation-delay: -9.6s"/>
              <text x="220" y="58" text-anchor="middle">000</text>
              <text x="384" y="224">090</text>
              <text x="220" y="394" text-anchor="middle">180</text>
              <text x="56" y="224" text-anchor="end">270</text>
              <text x="40" y="450">FIG. 1 · S-BAND TRACKING</text>
            </svg>
            <svg class="bp-art bp-orbit" viewBox="0 0 640 520">

              <path d="M40 280 H600 M300 30 V520" class="faint dash"/>

              <ellipse cx="300" cy="280" rx="54" ry="18" class="faint"/>
              <ellipse cx="300" cy="280" rx="20" ry="54" class="faint"/>
              <circle cx="300" cy="280" r="100"/>
              <circle cx="300" cy="280" r="230" class="dash"/>
              <path d="M400 280 A165 152 0 0 0 70 280" class="faint dash"/>
              <path d="M400 280 A165 152 0 0 0 70 280" class="bp-trace" pathLength="100"/>
              <circle cx="400" cy="280" r="3" class="fill"/>

              <g><animateMotion dur="19.2s" repeatCount="indefinite" rotate="auto" path="M400 280 A100 100 0 1 0 200 280 A100 100 0 1 0 400 280"/><path d="M0 -7 V7"/><rect x="-2.5" y="-2.5" width="5" height="5" class="fill"/></g>
              <g><animateMotion dur="67.2s" repeatCount="indefinite" path="M530 280 A230 230 0 1 0 70 280 A230 230 0 1 0 530 280"/><circle r="3.5" class="fill"/></g>
              <text x="410" y="306">ΔV1 +2.46 KM/S</text>
              <text x="80" y="306">ΔV2 +1.47 KM/S</text>
              <text x="380" y="200">LEO 405 KM</text>
              <text x="180" y="118">TRANSFER</text>
              <text x="470" y="100">GEO 35 786 KM</text>
            </svg>

              <path d="M82 360 L102 340 M98 360 L118 340 M114 360 L134 340 M130 360 L142 348" class="faint"/>

              <rect x="86" y="512" width="48" height="110" rx="10" class="dash"/>
              <rect x="86" y="630" width="48" height="90" rx="10" class="dash"/>
              <path d="M78 640 L46 750 L78 730 M142 640 L174 750 L142 730"/>
              <path d="M90 730 L84 780 H106 L100 730 M120 730 L114 780 H136 L130 730"/>
              <path d="M20 56 V780 M12 56 H70 M12 780 H80 M78 800 V830 M142 800 V830 M78 820 H142" class="faint"/>
              <path d="M16 66 L20 56 L24 66 M16 770 L20 780 L24 770"/>
              <text transform="translate(12 418) rotate(-90)" text-anchor="middle">70.0 M</text>
              <text x="110" y="850" text-anchor="middle">Ø 3.7 M</text>
              <path d="M126 120 L170 100 H200 M142 270 H200 M142 430 H200 M142 567 H200 M142 675 H200 M136 770 L170 790 H200" class="faint"/>
              <circle cx="126" cy="120" r="2" class="fill"/>
              <circle cx="142" cy="270" r="2" class="fill"/>
              <circle cx="142" cy="430" r="2" class="fill"/>
              <circle cx="142" cy="567" r="2.5" class="fill"/>
              <circle cx="142" cy="675" r="2" class="fill"/>
              <circle cx="136" cy="770" r="2" class="fill"/>
              <text x="206" y="104">FAIRING</text>
              <text x="206" y="274">PAYLOAD</text>
              <text x="206" y="434">STAGE 2</text>
              <text x="206" y="571">LOX</text>
              <text x="206" y="679">RP-1</text>
              <text x="206" y="794">ENGINES</text>
              <text x="10" y="892">DWG HSTN-07 · REV C</text>
            </svg>
          </div>
          <section id="stage" class="stage"></section>
          <nav id="dock" class="dock hidden" aria-label="Collapsed sessions"></nav>
          <section id="home" class="home hidden" aria-label="Home"></section>
        </div>
      </main>
    </div>
    <div id="boot">
      <div class="boot-card">
        <!-- The mark from src/icons.ts, drawn at boot size with ticks and meridians. -->
        <svg class="boot-mark" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="40" class="draw" pathLength="1" transform="rotate(-90 50 50)"/>
          <path d="M50 4v10M50 86v10M4 50h10M86 50h10" class="draw tick" pathLength="1"/>
          <circle cx="50" cy="50" r="16" class="draw body" pathLength="1"/>
          <g transform="rotate(-14 50 50)" class="faint"><ellipse cx="50" cy="50" rx="16" ry="4.5"/><ellipse cx="50" cy="50" rx="6.5" ry="16"/></g>
          <g class="boot-sat"><circle cx="50" cy="10" r="5"/></g>
        </svg>
        <div><div class="boot-title">HOUSTON</div><div class="boot-sub">mission control</div></div>
        <div class="boot-status"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" pathLength="1" transform="rotate(-90 8 8)"/></svg><span class="boot-text">Establishing uplink</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
