<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source for the app icons: regenerate with `npx tauri icon src-tauri/icons/icon.svg`.
       The mark from src/icons.ts at 7.5× (ring r40 → 300), drawn in ink on drafting film. -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <radialGradient id="film" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#16294a"/><stop offset=".7" stop-color="#0d1a30"/><stop offset="1" stop-color="#0a1426"/></radialGradient>
    <pattern id="minor" width="34.33" height="34.33" patternUnits="userSpaceOnUse" x="100" y="100"><path d="M34.33 0H0V34.33" fill="none" stroke="#8cc8f0" stroke-opacity=".05" stroke-width="2"/></pattern>
    <pattern id="major" width="103" height="103" patternUnits="userSpaceOnUse" x="100" y="100"><path d="M103 0H0V103" fill="none" stroke="#8cc8f0" stroke-opacity=".1" stroke-width="2"/></pattern>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#film)"/>
    <rect width="1024" height="1024" fill="url(#minor)"/>
    <rect width="1024" height="1024" fill="url(#major)"/>
    <!-- radar sweep -->
    <path d="M512 512 L512 212 A300 300 0 0 1 771.8 362 Z" fill="#8cc8f0" fill-opacity=".1"/>
  </g>

  <g fill="none" stroke="#8cc8f0" stroke-width="26" stroke-linecap="round">
    <circle cx="512" cy="512" r="300"/>
    <path d="M512 167v75M512 782v75M167 512h75M782 512h75" stroke-opacity=".55" stroke-width="22"/>
    <circle cx="512" cy="512" r="120" fill="#0f1d36"/>
    <g transform="rotate(-14 512 512)" stroke-opacity=".38" stroke-width="16">
      <ellipse cx="512" cy="512" rx="120" ry="34"/>
      <ellipse cx="512" cy="512" rx="49" ry="120"/>
    </g>
  </g>
  <!-- satellite at 45°, its halo cutting the ring -->
  <circle cx="724.1" cy="299.9" r="40" fill="#eba582" stroke="#12243f" stroke-width="44" paint-order="stroke"/>
</svg>
